<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Prevent TransOver / extension custom elements from crashing when accessing shadowRoot.querySelector
        try {
          var safeShadow = {
            querySelector: function() { return null; },
            querySelectorAll: function() { return []; },
            getElementById: function() { return null; },
            childNodes: [],
            children: []
          };

          var origDesc = Object.getOwnPropertyDescriptor(Element.prototype, 'shadowRoot');
          if (origDesc && origDesc.get) {
            var origGet = origDesc.get;
            Object.defineProperty(Element.prototype, 'shadowRoot', {
              configurable: true,
              enumerable: true,
              get: function() {
                var root = origGet.call(this);
                if (root) return root;
                if (this.tagName && this.tagName.toLowerCase().indexOf('transover') !== -1) {
                  return safeShadow;
                }
                return null;
              }
            });
          }

          if (typeof customElements !== 'undefined') {
            ['transover-popup', 'transover-tat-popup'].forEach(function(tag) {
              try {
                if (!customElements.get(tag)) {
                  customElements.define(tag, class extends HTMLElement {
                    constructor() {
                      super();
                      try {
                        if (!this.shadowRoot) this.attachShadow({ mode: 'open' });
                      } catch (e) {}
                    }
                  });
                }
              } catch (e) {}
            });
          }
        } catch (e) {}

        // Global suppression for extension errors
        window.addEventListener('error', function(e) {
          var file = e.filename || '';
          var msg = e.message || '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('contentscript.js') !== -1 ||
            msg.indexOf('aggiiclaiamajehmlfpkjmlbadmkledi') !== -1 ||
            msg.indexOf('querySelector') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Flight Price Intelligence — Real-Time Competitor Airfare Monitoring</title>
    <meta
      name="description"
      content="Compare airline airfares with competitor flights departing 1 to 10 hours before and after yours in real-time. Automated route benchmarking and OTA parity intelligence."
    />
    <meta
      name="keywords"
      content="flight price intelligence, airfare monitoring, competitor fare tracking, airline pricing tool, airline revenue management, OTA rate parity"
    />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

      html, body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
    </style>
